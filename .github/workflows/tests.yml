name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core + dev deps
        run: |
          pip install -e ".[dev]"
          pip install -r server/requirements.txt
      - name: Run the suite
        run: python -m pytest -q
      - name: Compile the shell (import-safety without a GUI)
        run: python -m py_compile zuki/shell/companion_manager.py zuki/shell/routing.py zuki/shell/tour.py zuki/shell/actions.py zuki/shell/harness.py zuki/shell/agent_skills.py zuki/shell/memory_store.py zuki/shell/config.py
