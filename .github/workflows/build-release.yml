name: Build Windows Release (EXE & MSI)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Zuki Windows Packages
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build & Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[shell,claude]"
          pip install pyinstaller

      - name: Build Standalone Application via PyInstaller
        run: |
          pyinstaller zuki.spec

      - name: Compile Inno Setup Installer (.exe)
        run: |
          choco install innosetup --no-progress
          iscc zuki/shell/installer.iss

      - name: Compile WiX Installer (.msi)
        run: |
          dotnet tool install --global wix
          wix build packaging/product.wxs -o dist/Zuki.msi

      - name: Archive Portable Folder (.zip)
        run: |
          Compress-Archive -Path dist\Zuki -DestinationPath dist\Zuki-portable.zip

      - name: Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Zuki-Windows-Installers
          path: |
            dist/Setup-Zuki.exe
            dist/Zuki.msi
            dist/Zuki-portable.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Setup-Zuki.exe
            dist/Zuki.msi
            dist/Zuki-portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
